spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000

logging:
  level:
    root: INFO
    org.springframework: WARN

server:
  port: 8080
