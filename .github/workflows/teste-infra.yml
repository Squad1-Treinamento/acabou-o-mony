name: Pipeline de Teste de Infraestrutura

# Define quando o teste será executado
on:
  push:
    branches: [ "teste-actions" ] # Agora só roda quando você enviar código para esta branch
  pull_request:
    branches: [ "teste-actions" ]

jobs:
  rodar-testes:
    runs-on: ubuntu-latest # Usa uma máquina Linux limpa fornecida pelo GitHub

    steps:
    # 1. Copia o código do seu repositório para dentro da máquina do GitHub
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Configura a versão do Python na máquina
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala as dependências necessárias para o script Python
    - name: Instalar dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa o script Python injetando o Token do ngrok de forma segura
    - name: Executar testes automatizados com Docker e Ngrok
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }} # Puxa o segredo salvo no Passo 1
      run: |
        pytest tests/test_entrypoint.py
        pytest tests/test_entrypoint_integration.py