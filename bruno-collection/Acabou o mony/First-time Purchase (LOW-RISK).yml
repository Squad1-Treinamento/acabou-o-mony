info:
  name: First-time Purchase (LOW-RISK)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments"
  body:
    type: json
    data: |-
      {
        "amount": 1000,
        "currency": "USD",
        "idempotency_key": "{{$randomUUID}}",
        "payment_method": {
          "type": "CARD",
          "masked_card": "411111XXXXXX1111",
          "card_token_id": "test_token_123"
        }
      }
  auth:
    type: bearer
    token: "{{apiKey}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
