server:
  # Port the 3DS Engine listens on. Default 8081 to avoid conflict with Core Service (default 8080).
  port: 8081

spring:
  application:
    # Application name used for logging, metrics, and service discovery.
    name: 3ds-engine

  redis:
    cluster:
      # Comma-separated list of Redis Cluster nodes (host:port).
      # Example: "192.168.1.10:6379,192.168.1.11:6379"
      nodes: localhost:6379
    # Redis password. Marked sensitive — do not set here. Use env SPRING_REDIS_PASSWORD.
    password:
    # Redis command timeout. Format: ISO-8601 duration or number+unit (e.g., 2000ms, 2s).
    timeout: 2000ms

jwt:
  # HS256 shared secret for JWT verification. Must be at least 256 bits (32 characters).
  # Marked sensitive — do not set here. Use env JWT_SECRET.
  # Default: dev fallback (256-bit static string) — never use in production.
  secret:
  # JWT expiration in seconds. Used by Core Service at signing time; the Engine reads
  # the `exp` claim from the token itself. This value is informational only.
  expiration-seconds: 600

3ds:
  # TTL for challenge sessions in Redis (seconds). After this time, the session is
  # considered expired and Redis auto-evicts the key. Default: 600 (10 minutes).
  session-ttl-seconds: 600
  # TTL for authentication results in Redis (seconds). Used for idempotency lookups.
  # Must be long enough to cover the idempotency window. Default: 86400 (24 hours).
  auth-result-ttl-seconds: 86400
  # Base URL of the Core Service callback endpoint. The Engine appends
  # "/api/v1/payments/3ds-callback" to this URL when notifying Core of MFA results.
  # No default — must be configured per environment.
  # Example: http://core-service:8080
  callback-url: http://localhost:8080/api/v1/payments/3ds-callback
  # Maximum incoming requests per second (rate limiting). Placeholder — not yet enforced.
  rate-limit-per-second: 100

risk:
  # Minimum risk score (0-100) that triggers 3DS step-up authentication.
  # Used by Core Service; documented here for reference.
  score-threshold: 70
  # Transaction value in BRL above which 3DS step-up is enforced regardless of risk score.
  # Used by Core Service; documented here for reference.
  high-value-threshold: 5000.00
