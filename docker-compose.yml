name: acabou-o-mony
services:
  nginx:
    container_name: nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - UPSTREAMS=${UPSTREAMS:-core-payment:8080}
      - UPSTREAM_HOST=${UPSTREAM_HOST}
      - UPSTREAM_PORT=${UPSTREAM_PORT}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - NGINX_TEMPLATE=/etc/nginx/nginx.conf.template
      - NGINX_CONF=/etc/nginx/conf.d/default.conf
    depends_on:
      core-payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - edge-net

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:alpine
    depends_on:
      - nginx
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "http://nginx:80"]
    networks:
      - edge-net

  postgres:
    image: postgres:15-alpine
    container_name: database-payment
    environment:
      POSTGRES_DB: payment-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment-service"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acabou-o-mony-network

  # Redis Standalone for Cache and Idempotency Layer
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - acabou-o-mony-network

  # 3DS / MFA Auth Engine
  3ds-engine:
    build: ./3ds-engine
    container_name: 3ds-engine
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_DATABASE=${REDIS_DATABASE:-0}
      - SPRING_DATA_REDIS_TIMEOUT=${REDIS_TIMEOUT_MS:-5000}ms
      - JWT_SECRET=${JWT_SECRET:-mony-3ds-jwt-secret-for-challenge-tokens-2024-production}
      - THREEDS_ENGINE_API_KEY=${THREEDS_API_KEY:-mony-3ds-api-key-2024-secure}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - acabou-o-mony-network
      - edge-net

  # Core Payment Service
  core-payment:
    build: ./core-payment
    container_name: core-payment
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      3ds-engine:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://database-payment:5432/payment-service}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-root123}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_DATABASE=${REDIS_DATABASE:-0}
      - SPRING_DATA_REDIS_TIMEOUT=${REDIS_TIMEOUT_MS:-5000}
      - THREEDS_BASE_URL=${THREEDS_BASE_URL:-http://3ds-engine:8080}
      - THREEDS_API_KEY=${THREEDS_API_KEY:-mony-3ds-api-key-2024-secure}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-test-token}
      - MERCADO_PAGO_API_URL=${MERCADO_PAGO_API_URL:-https://api.mercadopago.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - acabou-o-mony-network
      - edge-net

volumes:
  postgres_data:
    driver: local
  redis-data:
    driver: local

networks:
  edge-net:
    driver: bridge
  acabou-o-mony-network:
    driver: bridge
