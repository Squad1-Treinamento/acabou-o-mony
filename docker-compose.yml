name: acabou-o-mony
services:
  nginx:
    container_name: nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - UPSTREAMS=${UPSTREAMS}
      - UPSTREAM_HOST=${UPSTREAM_HOST}
      - UPSTREAM_PORT=${UPSTREAM_PORT}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - NGINX_TEMPLATE=/etc/nginx/nginx.conf.template
      - NGINX_CONF=/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - edge-net

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:alpine
    depends_on:
      - nginx
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "http://nginx:80"]
    networks:
      - edge-net
  
  # Example httpd service (for testing reverse proxy and load balancing)
  # Copy this block and uncomment to add more services for testing
  ## servico-a:
  ##   image: httpd:alpine
  ##   container_name: servico-a
  ##   command: [/bin/sh, -c, "echo '<html><body><h1>Servidor A</h1><p>Upstream: servico-b:80</p></body></html>' > /usr/local/apache2/htdocs/index.html && httpd-foreground"]
  ##   networks:
  ##     - edge-net
  ##   healthcheck:
  ##     test: ["CMD", "wget", "-qO-", "http://localhost/"]
  ##     interval: 5s
  ##     timeout: 3s
  ##     retries: 3
  
  # Example backend service (optional)
  # app:
  #   image: nginx:alpine
  #   networks:
  #     - edge-net

  # Redis Standalone for Cache and Idempotency Layer
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - acabou-o-mony-network
  
  # 3DS / MFA Auth Engine
  3ds-engine:
    build: ./3ds-engine
    container_name: 3ds-engine
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_DATABASE=${REDIS_DATABASE:-0}
      - SPRING_DATA_REDIS_TIMEOUT=${REDIS_TIMEOUT_MS:-5000}ms
    networks:
      - acabou-o-mony-network
      - edge-net
  
  # Core Payment Service (to be implemented)
  # core-service:
  #   build: ./core-service
  #   container_name: core-service
  #   ports:
  #     - "8082:8080"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
  #     - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
  #     - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
  #     - CACHE_ENABLED=${CACHE_ENABLED:-true}
  #     - CACHE_FALLBACK_TO_DB_ON_ERROR=${CACHE_FALLBACK_TO_DB_ON_ERROR:-true}
  #   networks:
  #     - acabou-o-mony-network
  #     - edge-net

volumes:
  redis-data:
    driver: local

networks:
  edge-net:
    driver: bridge
  acabou-o-mony-network:
    driver: bridge
