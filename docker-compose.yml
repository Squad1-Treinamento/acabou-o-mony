services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      - UPSTREAMS=${UPSTREAMS}
      - UPSTREAM_HOST=${UPSTREAM_HOST}
      - UPSTREAM_PORT=${UPSTREAM_PORT}
      - NGINX_TEMPLATE=/etc/nginx/nginx.conf.template
      - NGINX_CONF=/etc/nginx/conf.d/default.conf
    volumes:
      - ./docker/nginx/entrypoint.sh:/docker-entrypoint.sh:ro
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - edge-net

  ngrok:
    image: ngrok/ngrok:alpine
    depends_on:
      - nginx
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command: "if [ -z \"$NGROK_AUTHTOKEN\" ]; then echo 'NGROK_AUTHTOKEN is required' >&2; exit 1; fi; exec ngrok http http://nginx:80"
    networks:
      - edge-net

  # Example backend service (optional)
  # app:
  #   image: nginx:alpine
  #   networks:
  #     - edge-net

networks:
  edge-net:
    driver: bridge
