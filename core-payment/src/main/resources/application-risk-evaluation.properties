# Risk Evaluation Configuration
# 
# Spec: spec-001-core-payment-processing.md - Risk Evaluation Rules
# Task: task-018-risk-evaluation.md

# Enable/disable risk evaluation
# Set to false to disable risk evaluation (all transactions treated as low-risk)
risk.evaluation.enabled=true

# Amount threshold in cents (e.g., 50000 = 500 BRL)
# Transactions above this amount are flagged as high-risk
# Default: 50000 (500 BRL)
risk.evaluation.amount-threshold=50000

# Enable new card risk check
# Set to false to disable checking if card is new
# Default: true
risk.evaluation.enable-new-card-check=true

# Enable velocity risk check
# Set to false to disable checking transaction velocity
# Default: true
risk.evaluation.enable-velocity-check=true

# Maximum transactions per minute (for velocity check)
# Transactions exceeding this rate are flagged as high-risk
# Default: 10 transactions per minute
risk.evaluation.max-transactions-per-minute=10

# Velocity check time window in minutes
# Checks transaction count in this time window
# Default: 5 minutes
risk.evaluation.velocity-window-minutes=5
