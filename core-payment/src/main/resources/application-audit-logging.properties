# Structured Audit Logging Configuration
# 
# Spec: spec-001-core-payment-processing.md - Audit Log Persistence
# Task: task-019-structured-audit-logging.md

# Enable/disable structured audit logging
# Set to false to disable audit logging (not recommended for production)
audit.logging.enabled=true

# Audit log level
# DEBUG: Verbose logging for troubleshooting
# INFO: Standard logging
# WARN: Only warnings and errors
logging.level.AUDIT=INFO

# Audit logger configuration
logging.level.com.acabouomony.payment.domain.service.audit=INFO

# Log format for audit events
# JSON format for log aggregation and analysis
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Audit log file configuration
logging.file.name=logs/audit.log
logging.file.max-size=100MB
logging.file.max-history=30

# Data masking configuration
# Enable/disable data masking for PII
audit.masking.enabled=true

# Checksum algorithm
# SHA-256 is recommended for tamper detection
audit.checksum.algorithm=SHA-256

# Immutability enforcement
# Audit logs are INSERT-ONLY (no updates or deletes)
audit.immutability.enforced=true
